<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四〇四 · 页失其所</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }

        body {
            font-family: "Songti SC", "STSong", "SimSun", "Noto Serif CJK SC", serif;
            background:
                radial-gradient(ellipse at 30% 20%, rgba(184, 137, 74, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(160, 120, 80, 0.06) 0%, transparent 50%),
                #F5F2EA;
            color: #3A352B;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            /* 细纤维感：叠加一层噪点 */
            background-image:
                radial-gradient(ellipse at 30% 20%, rgba(184, 137, 74, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(160, 120, 80, 0.06) 0%, transparent 50%),
                repeating-linear-gradient(0deg, rgba(120, 100, 70, 0.015) 0px, rgba(120, 100, 70, 0.015) 1px, transparent 1px, transparent 3px);
        }

        /* 立轴容器 */
        .scroll {
            width: 480px;
            max-width: 100%;
            background: #FBF8F0;
            border: 1px solid #E5DCCB;
            border-radius: 4px;
            box-shadow:
                0 1px 0 rgba(255,255,255,0.8) inset,
                0 20px 40px -20px rgba(80, 60, 30, 0.25),
                0 4px 12px -4px rgba(80, 60, 30, 0.15);
            padding: 56px 56px 44px;
            position: relative;
        }

        /* 双层细边框 */
        .scroll::before {
            content: "";
            position: absolute;
            inset: 10px;
            border: 1px solid #EDE4D2;
            border-radius: 2px;
            pointer-events: none;
        }

        /* 印章红点（左上） */
        .seal {
            position: absolute;
            top: 28px;
            left: 32px;
            width: 44px;
            height: 44px;
            border: 1.5px solid #B06A4A;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: #B06A4A;
            letter-spacing: 1px;
            line-height: 1;
            opacity: 0.85;
            transform: rotate(-2deg);
            font-family: "Songti SC", "STSong", serif;
        }

        /* 大号数字 */
        .code {
            font-family: "Times New Roman", "Songti SC", "STSong", serif;
            font-size: 128px;
            font-weight: normal;
            color: #2A2520;
            text-align: center;
            letter-spacing: 4px;
            line-height: 1;
            margin: 20px 0 12px;
            /* 轻微毛笔飞白感 */
            text-shadow: 0 1px 0 rgba(100, 80, 50, 0.08);
        }

        /* 文言副题 */
        .subtitle {
            text-align: center;
            font-size: 16px;
            color: #7A6A4A;
            letter-spacing: 4px;
            margin-bottom: 4px;
        }

        /* 分隔细线 */
        .divider {
            width: 40px;
            height: 1px;
            background: #D8CDB8;
            margin: 20px auto;
        }

        /* 说明文字 */
        .desc {
            text-align: center;
            font-size: 14px;
            color: #9A9488;
            line-height: 1.9;
            letter-spacing: 1px;
            margin-bottom: 32px;
        }

        /* 返回按钮 */
        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn {
            display: inline-block;
            padding: 10px 28px;
            font-size: 14px;
            letter-spacing: 2px;
            color: #7A6A4A;
            text-decoration: none;
            border: 1px solid #D8CDB8;
            border-radius: 2px;
            background: transparent;
            transition: all 0.25s ease;
            cursor: pointer;
            font-family: inherit;
        }

        .btn:hover {
            background: #B8894A;
            color: #FBF8F0;
            border-color: #B8894A;
        }

        .btn-primary {
            background: #3A352B;
            color: #FBF8F0;
            border-color: #3A352B;
        }

        .btn-primary:hover {
            background: #B8894A;
            border-color: #B8894A;
        }

        /* 题款 */
        .signature {
            margin-top: 36px;
            text-align: right;
            font-size: 11px;
            color: #B5AF9F;
            letter-spacing: 2px;
        }

        /* 暗色模式 */
        @media (prefers-color-scheme: dark) {
            body {
                background:
                    radial-gradient(ellipse at 30% 20%, rgba(184, 137, 74, 0.12) 0%, transparent 50%),
                    #1a1814;
                color: #D8CDB8;
            }
            .scroll {
                background: #24211C;
                border-color: #3a342a;
                box-shadow: 0 20px 40px -20px rgba(0,0,0,0.5);
            }
            .scroll::before { border-color: #3a342a; }
            .code { color: #E8DFCD; text-shadow: none; }
            .subtitle { color: #A89C86; }
            .divider { background: #4a4238; }
            .desc { color: #8a8478; }
            .btn { color: #A89C86; border-color: #4a4238; }
            .btn-primary { background: #E8DFCD; color: #24211C; border-color: #E8DFCD; }
            .btn-primary:hover, .btn:hover { background: #B8894A; color: #1a1814; border-color: #B8894A; }
            .signature { color: #7a7468; }
            .seal { border-color: #D48A6A; color: #D48A6A; }
        }

        /* 手机 */
        @media (max-width: 520px) {
            .scroll { padding: 44px 28px 36px; }
            .code { font-size: 96px; letter-spacing: 2px; }
            .subtitle { font-size: 14px; letter-spacing: 3px; }
            .desc { font-size: 13px; }
            .seal { top: 22px; left: 24px; width: 36px; height: 36px; font-size: 11px; }
        }
    </style>
</head>

        <div class="actions">

            <a class="btn" href="javascript:history.back()">退 后 一 步</a>
        </div>

    </main>
</body>
</html>
