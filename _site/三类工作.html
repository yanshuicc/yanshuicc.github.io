    <div class="entry-date">2026-10-13</div>
    <p>现实工作应该划分为3类，分别是学习研究类、机械重复类、探索未知类。
第一类用以掌握某项知识技能、了解背景信息。
第二类是在第一种的基础上，重复劳动，完成工作量的积累。
第三类是真正意义上的创新创造，扩展人类知识边界，直面从来没人解决过的难题。也许更糟糕一些，题目本身也不存在，面对的是头绪纷杂的线索和不知道方向在何处的未来。</p>
