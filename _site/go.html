    <p>这几天心情不佳，耽搁了随笔记录。补上今天的作品，花了一天时间使用pygame制作了个围棋游戏。代码逻辑非常简单清晰，仅200余行。实现了基本的下棋、吃子功能、计算棋子的活，部分细节处理的不是很好，如重新开始游戏、游戏局势、悔棋、棋谱制作。</p>
