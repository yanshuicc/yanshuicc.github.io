---
layout: home
---

{% include background.html %}

<div id="content">
    <aside class="sidenav" id="sidenav">
        <div class="sidenav-header">
            <span class="sidenav-title">目录</span>
            <button class="sidenav-toggle" id="sidenavToggle" aria-label="折叠目录">−</button>
        </div>
        <div class="sidenav-body" id="sidenavBody">
            {% include toc.html html=content %}
        </div>
    </aside>

    <div class="entry">
        <div class="entry-title"><a href="{{ page.url }}" title="{{ page.title }}">{{ page.title }}</a></div>
        <div class="entry-date">{{ page.date | date: "%Y-%m-%d" }}</div>
        {{ content }}

        
        {% include ai-notice.html %}
    </div>
</div>

<script>
    (function () {
        var $side = $('#sidenav');
        var $btn = $('#sidenavToggle');
        var $body = $('#sidenavBody');
    
        /* ===== 1. 整体折叠 ===== */
        $btn.on('click', function () {
            $side.toggleClass('collapsed');
            $btn.text($side.hasClass('collapsed') ? '+' : '−');
        });
    
        /* ===== 2. 每级独立折叠 ===== */
        $body.find('li').each(function () {
            var $li = $(this);
            var $sub = $li.children('ul');
            if (!$sub.length) 
            {
                return;
            }
            $li.addClass('has-children');
    
            var $toggle = $('<span class="toc-toggle" aria-label="折叠该级">−</span>');
            $li.prepend($toggle);
        });
    
        $body.on('click', '.toc-toggle', function (e) {
            e.preventDefault();
            e.stopPropagation();
            var $li = $(this).closest('li');
            $li.toggleClass('collapsed');
            $(this).text($li.hasClass('collapsed') ? '+' : '−');
        });
    })();
</script>
