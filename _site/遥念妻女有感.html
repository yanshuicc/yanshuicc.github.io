<span class="caption">遥念妻女思归感怀</span><br />
</div>
<div class="poem serif">
高楼悬明月，羁京家万里。<br />

星奔川骛逝，人生隔参商。<br />

梦绕巴山雨，心随汉水长。<br />

愿即归渝州，闲居共白头。​<br />
