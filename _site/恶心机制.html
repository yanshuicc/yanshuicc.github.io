    <p>口水在最里面没事，吐出来就会觉得恶心。咽下口中的津液不会有任何不适，但是如果将口水吐到手心或者书桌上，就会本能的心生抵触。与我共存的同一个物质，几秒钟的时间切换一个物理空间，脱离躯体暴露在外，就瞬间变成了让人排斥的污秽。皮肤碎屑、脱落的死皮、凝聚的雪茄、汗液尿液、鼻屎大便，所有源自我们身体的产物皆是如此。依附躯体时，与我们浑然一体，可一旦它们脱落剥离，从自我的那部分变成了独立的外在之物，就会触发我们的恶心本能。</p>
