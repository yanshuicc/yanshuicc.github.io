---
layout:           home
---

{% include background.html %}

<div id="content">
<div class="entry">
    <div class="entry-title"><a href="{{ page.url }}" title="{{ page.title }}">{{ page.title }}</a></div>
    <div class="entry-date">{{ page.date|date:"%Y-%m-%d" }}</div>
    {{ content }}

    {% if page.ai_assisted != false %}
    <div class="ai-notice">
        本文写作过程中使用了 AI 辅助整理，内容经作者核对与修改。
    </div>
    {% endif %}
</div>
</div>
