<!--导航栏-->
<header class="site-header">
    <div class="header-inner">
        <div class="site-brand">
            <a href="/" class="site-title">偶得集</a>
            <div id="random-line" class="random-line"></div>
        </div>

        <nav class="site-nav">
            <a href="/" {% if page.url == "/" %}class="active"{% endif %}>随笔</a>
            <a href="/thinking/" {% if page.url contains "/thinking" %}class="active"{% endif %}>灵光</a>
            <a href="/memory" {% if page.url contains "/memory" %}class="active"{% endif %}>知识库</a>
            <a href="/project" {% if page.url contains "/project" %}class="active"{% endif %}>项目</a>
        </nav>
    </div>
</header>

<script>
    var lines = {{ site.data.flash_of_insight | jsonify }};
    if (lines && lines.length) {
        var line = lines[Math.floor(Math.random() * lines.length)];
        document.getElementById('random-line').textContent = line["content"];
    }
</script>
